schema: spec-driven

context: |
  Language: zh-CN. Write artifacts in Chinese; keep OpenSpec structural headings
  and SHALL/MUST, WHEN/THEN keywords in English.
  Project: JXPhotoBrowser, a UIKit photo/video browser library, iOS 15+, Swift 5.4+.
  Sources/ is the published library. The core has no third-party dependency or
  business data model; hosts provide data/loading through delegates and custom cells.
  Distribution: SwiftPM (Package.swift), CocoaPods (JXPhotoBrowser.podspec), Carthage.
  Integrations: Demo-UIKit (CocoaPods workspace), Demo-SwiftUI (SwiftPM), Demo-Carthage.
  Read AGENTS.md and Documentation/AgentWorkflow.md for project rules.
  Use CodeGraph first for indexed code; read docs/config directly. Fall back for
  unavailable or stale indexes. Graph edges are not runtime or test evidence.
  Preserve existing user changes. Do not hand-edit Pods/, .build/, or Carthage/ outputs.
  No standalone Tests target currently exists. UIKit requires an iOS Xcode build;
  plain macOS swift build is not a valid library build check.
  Select validation by scope; documentation-only changes do not require iOS builds.
  Specs describe intended contracts; source describes implementation. Surface conflicts.

rules:
  proposal:
    - State the problem, observable outcome, scope and non-goals; distinguish existing behavior from new requirements.
    - Identify affected integrations and public compatibility; avoid unrelated cleanup.
  specs:
    - Every requirement must have a concrete WHEN/THEN scenario and use SHALL or MUST.
    - Record externally observable behavior; do not claim a source inspection proves runtime acceptance.
  design:
    - Explain the smallest sufficient approach and any ownership, lifecycle, gesture or compatibility impact.
    - Reference relevant source paths found through CodeGraph; avoid copying source into specs.
  tasks:
    - Each task must state its completion evidence; check it only after that evidence exists.
    - Include required build and interaction checks with the related implementation task; mark unavailable verification as pending.

operations:
  apply:
    guidance:
      - Follow the user's authorized scope; keep code changes minimal and maintain task status honestly.
      - Report static validation, builds, simulator/device checks and delivery as separate evidence.
  archive:
    guidance:
      - Complete required tasks and verification before archiving; synchronize deltas into main specs.
      - Use the CLI archive command with validation, then validate the resulting main specs.
